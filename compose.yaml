# A fixed name keeps the volume called my-expenses_data whatever the folder is called.
name: my-expenses

services:
  app:
    build: .
    ports:
      - "3100:3100"
    env_file: .env
    environment:
      # Set here so they win over .env: the data must land on the volume.
      DATABASE_PATH: /data/app.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
